name: Link Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lychee:
    name: Check links in repo and wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --exclude-mail
            --accept 200,204,206,301,302,307,308
            . wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
